<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Timer</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Overlay Sélection de Langue */
    .lang-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .lang-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 28px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .lang-card h2 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lang-card p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 24px; }

    .lang-select {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f172a;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .lang-submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .top-options {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
    }

    .option-box {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .toggle-container { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .toggle-switch {
      position: relative; width: 40px; height: 22px; background-color: #334155; border-radius: 20px; transition: 0.2s;
    }
    .toggle-switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background-color: #fff; border-radius: 50%; transition: 0.2s;
    }
    input[type="checkbox"]:checked + .toggle-switch { background-color: #6366f1; }
    input[type="checkbox"]:checked + .toggle-switch::after { transform: translateX(18px); }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 40px;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle { color: #94a3b8; font-size: 1.05rem; margin-bottom: 28px; }

    .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #1e293b;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn.active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    /* Multi-Online UI */
    .online-box {
      display: none;
      width: 100%;
      margin-bottom: 20px;
      background: rgba(15, 23, 42, 0.5);
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .online-inputs { display: flex; gap: 10px; margin-top: 10px; }
    .online-input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2);
      background: #0f172a; color: #fff; text-align: center; font-size: 1rem; outline: none;
    }

    .target-box {
      background: rgba(15, 23, 42, 0.7);
      padding: 20px 32px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      width: 100%;
    }

    .target-box span { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .target-box div { font-size: 2.8rem; font-weight: 800; color: #38bdf8; margin-top: 4px; }

    .timer-display {
      font-size: 5rem;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 800;
      margin: 15px 0 25px 0;
      color: #f1f5f9;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    .action-btn {
      width: 100%;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
      transition: all 0.15s ease;
    }

    .action-btn.stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
    }

    .status-msg { font-size: 0.95rem; color: #38bdf8; margin-bottom: 12px; font-weight: 600; }

    .results { margin-top: 24px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; background: rgba(15, 23, 42, 0.5); border-radius: 14px; font-size: 1rem;
    }
    .score-badge { font-weight: 700; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="lang-overlay" id="langOverlay">
    <div class="lang-card">
      <h2>Langue / Language</h2>
      <p>Choisis ta langue :</p>
      <select id="langSelect" class="lang-select">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
      </select>
      <button class="lang-submit-btn" onclick="submitLanguage()">VALIDER / PLAY</button>
    </div>
  </div>

  <div class="top-options">
    <div class="option-box">
      <label class="toggle-container">
        <span id="txtDecimals">Afficher les dixièmes (ex: 2.3)</span>
        <input type="checkbox" id="msToggle" checked onchange="toggleDecimals()" style="display: none;">
        <div class="toggle-switch"></div>
      </label>
    </div>
  </div>

  <div class="container">
    <h1>Extreme Timer</h1>
    <p class="subtitle" id="txtSubtitle">Arrête le chronomètre au plus proche de l'objectif !</p>

    <div class="mode-selector">
      <button class="btn active" id="btnSolo" onclick="setMode('solo', this)">Solo</button>
      <button class="btn" id="btnOnline" onclick="setMode('online', this)">En ligne ⚡</button>
      <button class="btn" id="btnAI" onclick="setMode('ai', this)">VS IA</button>
      <button class="btn" id="btnP2" onclick="setMode('p2', this)">2 Joueurs</button>
    </div>

    <!-- Section multijoueur Firebase -->
    <div class="online-box" id="onlineBox">
      <p style="font-size: 0.9rem; color: #94a3b8;">Entre un code de salon pour jouer avec un ami :</p>
      <div class="online-inputs">
        <input type="text" id="roomInput" class="online-input" placeholder="Code du salon (ex: 1234)" maxlength="6">
        <button class="btn active" onclick="joinRoom()">REJOINDRE / CRÉER</button>
      </div>
    </div>

    <div class="target-box">
      <span id="txtTargetLabel">Temps Cible</span>
      <div id="targetDisplay">5.0s</div>
    </div>

    <div class="timer-display" id="timer">0.0</div>
    <div id="statusMsg" class="status-msg" style="display: none;"></div>

    <button class="action-btn" id="actionBtn" onclick="handleAction()">LANCER</button>
    
    <div class="results" id="results"></div>
  </div>

  <script>
    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCKrFKbtKEtIY7N7gqOEplfvW1WelfgoI",
      authDomain: "extreme-timer.firebaseapp.com",
      databaseURL: "https://extreme-timer-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "extreme-timer",
      storageBucket: "extreme-timer.firebasestorage.app",
      messagingSenderId: "503961343619",
      appId: "1:503961343619:web:868bc2bf98dbdf2c726db6",
      measurementId: "G-60NQWRS482"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentLang = 'fr';
    let mode = 'solo';
    let isRunning = false;
    let startTime = 0;
    let timerInterval = null;
    let targetTime = 5.0;
    let p1Time = null, p2Time = null;
    let activePlayer = 1;
    let showDecimals = true;

    // Multijoueur variables
    let currentRoom = null;
    let myPlayerRole = null; // 'p1' or 'p2'

    const dict = {
      fr: {
        decimals: "Afficher les dixièmes (ex: 2.3)",
        subtitle: "Arrête le chronomètre au plus proche de l'objectif !",
        modeSolo: "Solo", modeOnline: "En ligne ⚡", modeAI: "VS IA", modeP2: "2 Joueurs",
        targetLabel: "Temps Cible", btnStart: "LANCER", btnStop: "STOP !", btnReplay: "REJOUER"
      },
      en: {
        decimals: "Show tenths (ex: 2.3)",
        subtitle: "Stop the timer as close to the target as possible!",
        modeSolo: "Solo", modeOnline: "Online ⚡", modeAI: "VS AI", modeP2: "2 Players",
        targetLabel: "Target Time", btnStart: "START", btnStop: "STOP!", btnReplay: "PLAY AGAIN"
      },
      es: {
        decimals: "Mostrar décimas (ej: 2.3)",
        subtitle: "¡Detén el temporizador lo más cerca posible del objetivo!",
        modeSolo: "Solo", modeOnline: "En línea ⚡", modeAI: "VS IA", modeP2: "2 Jugadores",
        targetLabel: "Tiempo Objetivo", btnStart: "INICIAR", btnStop: "¡ALTO!", btnReplay: "JUGAR DE NUEVO"
      }
    };

    function submitLanguage() {
      currentLang = document.getElementById('langSelect').value;
      document.getElementById('langOverlay').style.display = 'none';
      applyLanguage();
      resetGame();
    }

    function applyLanguage() {
      const t = dict[currentLang];
      document.getElementById('txtDecimals').textContent = t.decimals;
      document.getElementById('txtSubtitle').textContent = t.subtitle;
      document.getElementById('btnSolo').textContent = t.modeSolo;
      document.getElementById('btnOnline').textContent = t.modeOnline;
      document.getElementById('btnAI').textContent = t.modeAI;
      document.getElementById('btnP2').textContent = t.modeP2;
      document.getElementById('txtTargetLabel').textContent = t.targetLabel;
    }

    function toggleDecimals() {
      showDecimals = document.getElementById('msToggle').checked;
      document.getElementById('targetDisplay').textContent = formatTime(targetTime) + 's';
    }

    function formatTime(s) {
      return showDecimals ? s.toFixed(1) : Math.floor(s).toString();
    }

    function setMode(newMode, btnElement) {
      if (isRunning) return;
      mode = newMode;
      document.querySelectorAll('.mode-selector .btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      
      document.getElementById('onlineBox').style.display = (mode === 'online') ? 'block' : 'none';
      resetGame();
    }

    function resetGame() {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('timer').textContent = formatTime(0);
      document.getElementById('statusMsg').style.display = 'none';
      document.getElementById('actionBtn').classList.remove('stop');
      document.getElementById('actionBtn').disabled = false;
      document.getElementById('results').innerHTML = '';
      p1Time = null; p2Time = null;
      document.getElementById('actionBtn').textContent = dict[currentLang].btnStart;

      if (mode !== 'online') {
        targetTime = Math.floor(Math.random() * 7) + 3;
        document.getElementById('targetDisplay').textContent = formatTime(targetTime) + 's';
      }
    }

    /* LOGIQUE EN LIGNE (FIREBASE) */
    function joinRoom() {
      const roomCode = document.getElementById('roomInput').value.trim();
      if (!roomCode) return alert("Entre un code de salon !");
      
      currentRoom = roomCode;
      const roomRef = db.ref('rooms/' + roomCode);

      roomRef.get().then((snapshot) => {
        if (!snapshot.exists()) {
          // Créer le salon (Joueur 1)
          myPlayerRole = 'p1';
          targetTime = Math.floor(Math.random() * 7) + 3;
          roomRef.set({ target: targetTime, p1: null, p2: null });
          showStatus("Salon créé ! Donne le code " + roomCode + " à ton ami.");
        } else {
          // Rejoindre le salon (Joueur 2)
          myPlayerRole = 'p2';
          targetTime = snapshot.val().target;
          showStatus("Connecté au salon " + roomCode + " ! Tu es le Joueur 2.");
        }

        document.getElementById('targetDisplay').textContent = formatTime(targetTime) + 's';
        listenRoomUpdates(roomRef);
      });
    }

    function listenRoomUpdates(roomRef) {
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        p1Time = data.p1;
        p2Time = data.p2;

        if (p1Time !== null && p2Time !== null) {
          showVSResult(p1Time, p2Time, "Joueur 1", "Joueur 2");
          document.getElementById('actionBtn').textContent = dict[currentLang].btnReplay;
        } else if (myPlayerRole === 'p1' && p1Time !== null) {
          showStatus("En attente du score du Joueur 2...");
        } else if (myPlayerRole === 'p2' && p2Time !== null) {
          showStatus("En attente du score du Joueur 1...");
        }
      });
    }

    function showStatus(msg) {
      const st = document.getElementById('statusMsg');
      st.style.display = 'block';
      st.textContent = msg;
    }

    function handleAction() {
      if (document.getElementById('actionBtn').textContent === dict[currentLang].btnReplay) {
        if (mode === 'online' && currentRoom) {
          db.ref('rooms/' + currentRoom).set({ target: Math.floor(Math.random() * 7) + 3, p1: null, p2: null });
        }
        resetGame();
        return;
      }

      if (!isRunning) startTimer();
      else stopTimer();
    }

    function startTimer() {
      isRunning = true;
      startTime = performance.now();
      document.getElementById('actionBtn').textContent = dict[currentLang].btnStop;
      document.getElementById('actionBtn').classList.add('stop');

      timerInterval = setInterval(() => {
        document.getElementById('timer').textContent = formatTime((performance.now() - startTime) / 1000);
      }, 50);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      const finalTime = (performance.now() - startTime) / 1000;
      document.getElementById('timer').textContent = formatTime(finalTime);
      document.getElementById('actionBtn').classList.remove('stop');

      if (mode === 'solo') {
        showSoloResult(finalTime);
        document.getElementById('actionBtn').textContent = dict[currentLang].btnReplay;
      } else if (mode === 'ai') {
        const aiTime = targetTime + (Math.random() - 0.5) * 0.4;
        showVSResult(finalTime, Math.max(0, aiTime), "Toi", "IA");
        document.getElementById('actionBtn').textContent = dict[currentLang].btnReplay;
      } else if (mode === 'online') {
        if (!currentRoom) return alert("Rejoins d'abord un salon !");
        db.ref('rooms/' + currentRoom + '/' + myPlayerRole).set(finalTime);
      } else if (mode === 'p2') {
        if (activePlayer === 1) {
          p1Time = finalTime;
          activePlayer = 2;
          document.getElementById('actionBtn').textContent = "J2 : LANCER";
          document.getElementById('timer').textContent = formatTime(0);
        } else {
          p2Time = finalTime;
          showVSResult(p1Time, p2Time, "Joueur 1", "Joueur 2");
          document.getElementById('actionBtn').textContent = dict[currentLang].btnReplay;
        }
      }
    }

    function showSoloResult(time) {
      const diff = Math.abs(time - targetTime);
      document.getElementById('results').innerHTML = `
        <div class="result-row">
          <span>Écart avec la cible :</span>
          <span class="score-badge">${diff.toFixed(1)}s</span>
        </div>
      `;
    }

    function showVSResult(t1, t2, name1, name2) {
      const diff1 = Math.abs(t1 - targetTime);
      const diff2 = Math.abs(t2 - targetTime);
      let winner = name1;
      if (diff2 < diff1) winner = name2;
      else if (diff1 === diff2) winner = "Égalité";

      document.getElementById('results').innerHTML = `
        <div class="result-row"><span>${name1} : ${formatTime(t1)}s</span><span class="score-badge">${diff1.toFixed(1)}s d'écart</span></div>
        <div class="result-row"><span>${name2} : ${formatTime(t2)}s</span><span class="score-badge">${diff2.toFixed(1)}s d'écart</span></div>
        <div class="result-row" style="background: rgba(99, 102, 241, 0.25);">
          <span>Gagnant :</span><span style="color: #38bdf8; font-weight: bold;">🏆 ${winner}</span>
        </div>
      `;
    }
  </script>
</body>
</html>
